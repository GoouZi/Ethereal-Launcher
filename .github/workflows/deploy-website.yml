name: Deploy Ethereal Website

on:
  push:
    branches:
      - main
    paths:
      - "website-deploy/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EMCL_SSH_KEY }}
          SSH_HOST: ${{ secrets.EMCL_HOST }}
          SSH_PORT: ${{ secrets.EMCL_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/emcl_deploy_key
          chmod 600 ~/.ssh/emcl_deploy_key
          ssh-keyscan -H -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Prepare server directories
        env:
          SSH_HOST: ${{ secrets.EMCL_HOST }}
          SSH_USER: ${{ secrets.EMCL_USER }}
          SSH_PORT: ${{ secrets.EMCL_PORT }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/emcl_deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'mkdir -p /www/wwwroot/emcl.goouzi.top/update/releases /www/wwwroot/emcl.goouzi.top/changelog'

      - name: Mirror latest release asset to website
        env:
          SSH_HOST: ${{ secrets.EMCL_HOST }}
          SSH_USER: ${{ secrets.EMCL_USER }}
          SSH_PORT: ${{ secrets.EMCL_PORT }}
        run: |
          set -euo pipefail

          META="website-deploy/update/latest.json"
          if [ ! -f "$META" ]; then
            echo "latest.json not present; skipping release mirror."
            exit 0
          fi

          GITHUB_URL="$(python3 -c 'import json; d=json.load(open("website-deploy/update/latest.json", encoding="utf-8")); print(d.get("github_download_url") or "")')"
          EXPECTED_SHA="$(python3 -c 'import json; d=json.load(open("website-deploy/update/latest.json", encoding="utf-8")); print(d.get("sha256") or "")')"

          if [ -z "$GITHUB_URL" ]; then
            echo "No GitHub release asset URL found in latest.json."
            exit 1
          fi

          FILE_NAME="$(basename "$GITHUB_URL")"
          TMP_DIR="/tmp/emcl-release-mirror"
          mkdir -p "$TMP_DIR"

          curl -fL --retry 3 --retry-delay 2 "$GITHUB_URL" -o "$TMP_DIR/$FILE_NAME"

          if [ -n "$EXPECTED_SHA" ]; then
            ACTUAL_SHA="$(sha256sum "$TMP_DIR/$FILE_NAME" | awk '{print $1}')"
            test "$ACTUAL_SHA" = "$EXPECTED_SHA"
            printf '%s  %s\n' "$EXPECTED_SHA" "$FILE_NAME" > "$TMP_DIR/$FILE_NAME.sha256"
          fi

          rsync -avz --omit-dir-times --no-perms --no-owner --no-group \
            -e "ssh -i ~/.ssh/emcl_deploy_key -p $SSH_PORT" \
            "$TMP_DIR/$FILE_NAME" \
            "$SSH_USER@$SSH_HOST:/www/wwwroot/emcl.goouzi.top/update/releases/$FILE_NAME"

          if [ -f "$TMP_DIR/$FILE_NAME.sha256" ]; then
            rsync -avz --omit-dir-times --no-perms --no-owner --no-group \
              -e "ssh -i ~/.ssh/emcl_deploy_key -p $SSH_PORT" \
              "$TMP_DIR/$FILE_NAME.sha256" \
              "$SSH_USER@$SSH_HOST:/www/wwwroot/emcl.goouzi.top/update/releases/$FILE_NAME.sha256"
          fi

          ssh -i ~/.ssh/emcl_deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "cp -f '/www/wwwroot/emcl.goouzi.top/update/releases/$FILE_NAME' '/www/wwwroot/emcl.goouzi.top/update/releases/Ethereal-Launcher-latest.zip'"

          if [ -n "$EXPECTED_SHA" ]; then
            REMOTE_SHA="$(ssh -i ~/.ssh/emcl_deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
              "sha256sum '/www/wwwroot/emcl.goouzi.top/update/releases/$FILE_NAME' | awk '{print \$1}'")"
            LATEST_SHA="$(ssh -i ~/.ssh/emcl_deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
              "sha256sum '/www/wwwroot/emcl.goouzi.top/update/releases/Ethereal-Launcher-latest.zip' | awk '{print \$1}'")"
            test "$REMOTE_SHA" = "$EXPECTED_SHA"
            test "$LATEST_SHA" = "$EXPECTED_SHA"
          fi

      - name: Deploy changelog files
        env:
          SSH_HOST: ${{ secrets.EMCL_HOST }}
          SSH_USER: ${{ secrets.EMCL_USER }}
          SSH_PORT: ${{ secrets.EMCL_PORT }}
        run: |
          set -euo pipefail
          rsync -avz --omit-dir-times --no-perms --no-owner --no-group \
            -e "ssh -i ~/.ssh/emcl_deploy_key -p $SSH_PORT" \
            website-deploy/changelog/ \
            "$SSH_USER@$SSH_HOST:/www/wwwroot/emcl.goouzi.top/changelog/"

      - name: Deploy update metadata
        env:
          SSH_HOST: ${{ secrets.EMCL_HOST }}
          SSH_USER: ${{ secrets.EMCL_USER }}
          SSH_PORT: ${{ secrets.EMCL_PORT }}
        run: |
          set -euo pipefail
          rsync -avz --omit-dir-times --no-perms --no-owner --no-group \
            --exclude 'appcast.xml' \
            --exclude 'releases/' \
            -e "ssh -i ~/.ssh/emcl_deploy_key -p $SSH_PORT" \
            website-deploy/update/ \
            "$SSH_USER@$SSH_HOST:/www/wwwroot/emcl.goouzi.top/update/"

      - name: Publish Sparkle appcast last
        env:
          SSH_HOST: ${{ secrets.EMCL_HOST }}
          SSH_USER: ${{ secrets.EMCL_USER }}
          SSH_PORT: ${{ secrets.EMCL_PORT }}
        run: |
          set -euo pipefail
          rsync -avz --omit-dir-times --no-perms --no-owner --no-group \
            -e "ssh -i ~/.ssh/emcl_deploy_key -p $SSH_PORT" \
            website-deploy/update/appcast.xml \
            "$SSH_USER@$SSH_HOST:/www/wwwroot/emcl.goouzi.top/update/appcast.xml"

      - name: Verify public deployment
        run: |
          set -euo pipefail
          curl -fsSL "https://emcl.goouzi.top/update/latest.json" -o /tmp/latest.json
          curl -fsSL "https://emcl.goouzi.top/update/releases.json" -o /tmp/releases.json
          curl -fsSL "https://emcl.goouzi.top/update/appcast.xml" -o /tmp/appcast.xml
          curl -fsSL "https://emcl.goouzi.top/changelog/" -o /tmp/changelog.html
          curl -fsSL --range 0-0 "https://emcl.goouzi.top/update/releases/Ethereal-Launcher-latest.zip" -o /dev/null
