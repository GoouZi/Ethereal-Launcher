<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>更新记录 — Ethereal Launcher</title>
  <meta name="description" content="Ethereal Launcher 更新记录">
  <style>
    :root{color-scheme:dark;--bg:#000;--surface:#0b0b0d;--text:#f5f5f7;--muted:#86868b;--line:rgba(255,255,255,.11);--blue:#2997ff}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}
    .topbar{position:sticky;top:0;z-index:10;height:52px;background:rgba(0,0,0,.72);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(255,255,255,.08)}
    .topbar-inner{width:min(980px,calc(100% - 40px));height:100%;margin:auto;display:flex;align-items:center;justify-content:space-between}
    .brand{font-size:14px;font-weight:600;letter-spacing:-.01em}
    .back{font-size:13px;color:var(--blue)}
    main{width:min(980px,calc(100% - 40px));margin:auto}
    .hero{padding:112px 0 86px;border-bottom:1px solid var(--line)}
    .eyebrow{font-size:17px;font-weight:600;color:#a1a1a6;margin-bottom:16px}
    h1{font-size:clamp(48px,7vw,82px);line-height:.98;letter-spacing:-.055em;margin:0;font-weight:700}
    .lede{margin:26px 0 0;color:var(--muted);font-size:20px;line-height:1.5;max-width:680px}
    .release{padding:62px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:220px minmax(0,1fr);gap:58px}
    .release h2{font-size:34px;line-height:1.05;letter-spacing:-.035em;margin:0 0 10px}
    .meta{font-size:14px;color:var(--muted);line-height:1.6}
    .latest{display:inline-flex;margin-top:14px;padding:6px 10px;border:1px solid rgba(41,151,255,.5);border-radius:999px;color:#69b7ff;font-size:12px;font-weight:600}
    ul{margin:0;padding-left:1.2em}
    li{font-size:17px;line-height:1.72;color:#d2d2d7;margin:.42em 0}
    .actions{margin-top:24px;display:flex;gap:18px;flex-wrap:wrap}
    .actions a{font-size:14px;color:var(--blue)}
    .loading,.error{padding:70px 0;color:var(--muted);font-size:17px}
    footer{padding:38px 0 70px;color:#6e6e73;font-size:12px}
    @media(max-width:720px){
      .hero{padding:82px 0 62px}
      .release{grid-template-columns:1fr;gap:26px;padding:48px 0}
      .release h2{font-size:30px}
      li{font-size:16px}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">Ethereal Launcher</a>
      <a class="back" href="/">返回首页</a>
    </div>
  </header>
  <main>
    <section class="hero">
      <div class="eyebrow">Ethereal Launcher</div>
      <h1>更新记录</h1>
      <p class="lede">这里汇总 Ethereal Launcher 已确认的版本变化。最新版本会优先显示，历史记录保留在下方。</p>
    </section>
    <div id="releases" class="loading">正在读取更新记录…</div>
    <footer>© 2026 Goou_Zi · Ethereal Launcher</footer>
  </main>
  <script>
    const root = document.getElementById('releases');
    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    fetch('/update/releases.json', {cache:'no-store'})
      .then(r => { if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(data => {
        const list = Array.isArray(data.releases) ? data.releases : [];
        if(!list.length) throw new Error('empty');
        root.className = '';
        root.innerHTML = list.map(item => {
          const notes = (item.notes || []).map(n => '<li>'+escapeHtml(n)+'</li>').join('');
          const bits = [item.build ? 'Build '+escapeHtml(item.build) : '', escapeHtml(item.channel || '')];
          if(item.date) bits.push(escapeHtml(item.date));
          const actions = [];
          if(item.download_url) actions.push('<a href="'+escapeHtml(item.download_url)+'">直接下载</a>');
          if(item.github_url) actions.push('<a href="'+escapeHtml(item.github_url)+'" target="_blank" rel="noopener">GitHub Release</a>');
          return '<article class="release"><div><h2>'+escapeHtml(item.version)+'</h2><div class="meta">'+bits.filter(Boolean).join(' · ')+'</div>'+(item.latest?'<span class="latest">最新版本</span>':'')+'</div><div><ul>'+notes+'</ul>'+(actions.length?'<div class="actions">'+actions.join('')+'</div>':'')+'</div></article>';
        }).join('');
      })
      .catch(() => {
        root.className = 'error';
        root.textContent = '更新记录暂时无法载入，请稍后刷新。';
      });
  </script>
</body>
</html>
